[project]
name = "tsuki-pump-bot"
version = "0.2.0"
description = "Pump.fun watchtower + paper-trading bot. Multi-filter selection edge (dev blacklist, bundle/cluster detection, KOL convergence, bonding-curve graduation, CTO detection). Paper-default. Async Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TSUKImint" }]

dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "rich>=13.7",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "base58>=2.1",
]

[project.optional-dependencies]
# Solana SDKs are only needed in devnet / mainnet executor modes. Paper-mock
# mode runs without them so we can validate the filter stack on any laptop.
live = [
    "solders>=0.21",
    "solana>=0.34",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "types-PyYAML>=6.0",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
tsuki-pump = "tsukibot_pump.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsukibot_pump"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "ASYNC",    # flake8-async
]
ignore = [
    "E501",     # line length handled by formatter
    "B008",     # function call in argument defaults — common with Depends
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "solana.*", "solders.*", "base58.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/tsukibot_pump"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
