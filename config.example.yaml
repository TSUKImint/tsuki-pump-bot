# tsuki-pump-bot — strategy thresholds (commit-safe, no secrets).
# Copy to config.yaml and tune. The bot reads this file at startup.

# ── Capital + risk ────────────────────────────────────────────────────────
bankroll:
  # Paper SOL bankroll (also used for sizing in mainnet mode as upper bound).
  total_sol: 10.0

  # Max position per token, as fraction of bankroll.
  single_token_cap_fraction: 0.05      # 5%

  # Daily and total drawdown limits (fraction of starting bankroll).
  # Bot trips kill switch when crossed.
  daily_drawdown_kill: 0.10            # 10%
  total_drawdown_kill: 0.25            # 25%

  # Max parallel open positions.
  max_open_positions: 12

# ── Sizing (fractional Kelly for directional bets) ────────────────────────
sizing:
  fraction_of_kelly: 0.20              # quarter-Kelly equivalent
  min_expected_roi: 0.30               # skip <30% expected upside
  # Hard cap per-trade in SOL, regardless of Kelly output.
  hard_cap_per_trade_sol: 0.5

# ── Scoring threshold ─────────────────────────────────────────────────────
scoring:
  # v0.3: which scorer to use.
  #   "weighted"               — v0.2 weighted-sum (legacy, deterministic)
  #   "graduation_probability" — v0.3 Lillo-Naviglio P(graduate|state) scorer
  #     based on arXiv:2602.14860 (Marino, Naviglio, Tarantelli, Lillo,
  #     Feb 2026; Università di Pisa / Scuola Normale / Bologna).
  mode: "weighted"

  # Composite score in [0, 100]. We enter a paper position only when score
  # is at or above this gate. For mode="graduation_probability" this is the
  # P(graduate) percentage (e.g. 40 == 40% predicted graduation chance).
  enter_threshold: 60
  # In watchtower mode we still log everything; this only gates the paper
  # executor.
  enter_threshold_watchtower_log: 40

  # Individual filter weights (must sum to 1.0).
  # Only used when mode="weighted".
  weights:
    dev_blacklist: 0.20                # negative-only filter, hard-fails if rugger
    bundle_cluster: 0.15
    first_kol_touch: 0.20
    convergence: 0.15
    curve_graduation: 0.20
    cto_revival: 0.10
    creator_vault: 0.00                # v0.3 filter; default-disabled in weighted mode

  # v0.3 aggressive paper-trader profile. Off by default — the bot stays
  # conservative until you opt in. When `enabled: true`, these knobs
  # OVERRIDE the corresponding fields elsewhere in this file (sizing,
  # bankroll cap, curve filter, poll interval) at startup. Logged once on
  # boot so you can confirm the effective values.
  aggressive_paper:
    enabled: false
    enter_threshold: 40                # was 60 — react earlier
    fraction_of_kelly: 0.50            # was 0.20 — half-Kelly, not quarter
    min_expected_roi: 0.10             # was 0.30 — accept thinner edges
    single_token_cap_fraction: 0.10    # was 0.05 — bigger per-token swings
    enter_after_sol_in_curve_gte: 25.0 # was 65 — enter earlier on the curve
    min_velocity_sol_per_min: 0.2      # was 0.5 — accept slower acceleration
    http_poll_interval_seconds: 1.5    # was 5 — poll faster (no-op w/ Helius WS)
    scoring_cycle_seconds: 2.5         # was 5 — score & enter twice as often

  # v0.3 early-conviction lane. When ON, a token is paper-bought even when
  # the curve filter would reject, IF (a) the on-chain creator has prior
  # graduations AND (b) >= min_kol_touches distinct tracked KOLs bought
  # within `window_seconds` of CREATE. The size is then capped by
  # `max_single_token_cap_fraction` (smaller than the normal cap because
  # the curve hasn't yet confirmed liquidity).
  early_conviction:
    enabled: false
    window_seconds: 30
    min_kol_touches: 2
    min_prior_graduations: 1
    max_single_token_cap_fraction: 0.03

# ── Filters ───────────────────────────────────────────────────────────────
filters:
  dev_blacklist:
    enabled: true
    # Hard-reject if creator wallet is on the blacklist OR has launched
    # >= this many tokens in the past N days.
    reject_if_known_rugger: true
    reject_if_dev_token_count_24h_gte: 5
    reject_if_dev_token_count_7d_gte: 15
    # Local path to a CSV of known scammer wallets (one per line). We seed
    # with the AllenHark public DB; user can add more.
    blacklist_csv_path: data/scammer_wallets.csv

  bundle_cluster:
    enabled: true
    # Reject if first-N-buyer concentration > this fraction in a single cluster.
    reject_cluster_concentration_gte: 0.30
    # First N buyers we analyze.
    first_n_buyers: 50
    # Treat buyers in the same Solana slot as a bundle.
    bundle_window_slots: 1

  first_kol_touch:
    enabled: true
    # Boost score if a tracked top-decile KOL was among the first N buyers.
    first_n_buyers: 20
    # Path to private KOL leaderboard (CSV: wallet, label, score).
    kol_csv_path: data/private_kol_list.csv
    # Score given per KOL touch (clamped at max_kol_touches).
    score_per_touch: 25
    max_kol_touches: 3

  convergence:
    enabled: true
    # When 2+ tracked KOLs buy the same token within this window.
    window_seconds: 600
    min_distinct_kols: 2
    score_at_minimum: 60
    score_per_extra_kol: 15

  curve_graduation:
    enabled: true
    # Bonding curve in SOL. Graduation occurs at ~85 SOL.
    enter_after_sol_in_curve_gte: 65
    # Required curve velocity over the last N seconds (SOL/min).
    min_velocity_sol_per_min: 0.5
    # Required minimum buyers in last 60s (filters one-wallet pumps).
    min_distinct_buyers_60s: 8

  cto_revival:
    enabled: true
    # Days since dev wallet last activity to be "abandoned".
    dev_silent_min_days: 2
    # Unique daily buyers floor (post-abandonment) to count as "revived".
    min_unique_buyers_24h: 30
    # Minimum days since launch (avoid sniping fresh failures).
    min_days_since_launch: 3

  # v0.3 creator-vault alignment filter. Reads the on-chain creator field
  # added to the BondingCurve account in pump.fun's May 2025 protocol
  # upgrade. Never hard-rejects; nudges the score based on creator
  # history:
  #   - aligned (>= min_prior_graduations_for_bonus prior wins) → 80
  #   - anonymous (no creator data, or 0 prior tokens) → 50
  #   - suspect (many prior tokens, none graduated) → 20
  creator_vault:
    enabled: false                     # default off; opt-in v0.3 feature
    min_prior_graduations_for_bonus: 1
    # Penalty trigger: launched >= N tokens in 7d with zero graduations.
    suspect_if_dev_token_count_7d_gte: 25
    score_aligned: 80
    score_anonymous: 50
    score_suspect: 20

# ── Execution / exit ladder ───────────────────────────────────────────────
execution:
  # Slippage simulated in paper mode.
  paper_slippage_bps: 75               # 0.75% taker on Solana DEX is realistic
  # Priority fee budget (micro-lamports per CU). Higher → faster inclusion
  # in busy blocks. Only used in devnet/mainnet modes.
  priority_fee_micro_lamports: 50000
  # Max compute units we'll request per swap tx.
  cu_limit: 600000

  # ── Paper realism layer (PR #C) ────────────────────────────────────────
  # Off by default for backwards-compat. Turn on once you want paper P&L
  # that's comparable to mainnet P&L. Without it paper mode looks rosier
  # than it should because:
  #   - the curve is treated as frozen between detection and fill
  #   - pump.fun's 1% trade fee is ignored
  #   - priority fees aren't charged
  #   - every buy succeeds (no slippage-exceeded / blockhash-expired fails)
  paper_realism:
    enabled: true
    # Pump.fun protocol fee (bps of notional). 125 bps = 1.25% per side
    # per pump.fun's own docs as of 7 Oct 2025 (was 100 bps before then).
    # Split: 30 bps creator vault + 95 bps protocol.
    pump_fee_bps: 125
    # Priority fee distribution (lamports). p50/p99 sampled per fill.
    priority_fee_lamports_p50: 50000
    priority_fee_lamports_p99: 300000
    # End-to-end latency distribution (ms). p50/p99 sampled per fill.
    end_to_end_latency_ms_p50: 1500
    end_to_end_latency_ms_p99: 5000
    # Probability that a paper buy / sell fails outright.
    buy_fail_prob: 0.10
    sell_fail_prob: 0.05
    # Set to an int for deterministic paper runs (useful for backtests).
    # rng_seed: 42

exits:
  # Profit ladder: at each multiple of entry, sell the listed fraction.
  ladder:
    - { roi: 1.0, sell_fraction: 0.50 }      # +100% → sell half
    - { roi: 3.0, sell_fraction: 0.30 }      # +300% → sell another 30%
    # remaining 20% rides with trailing stop
  trailing_stop_pct: 0.40              # 40% trailing stop on residual
  # Hard exit if dev wallet moves > this fraction of their balance.
  dev_drain_exit_fraction: 0.10
  # Hard exit if price drops > this from entry (overrides trailing).
  hard_stop_loss_pct: 0.50

# ── Watch sources ─────────────────────────────────────────────────────────
watch:
  # Subscribe to pump.fun program signatures via gRPC (preferred) or HTTP poll.
  use_grpc_if_available: true
  # v0.3: when true AND env var SOLANA_HELIUS_WS_URL is set, the bot uses
  # Helius's free logsSubscribe WebSocket (~200 ms latency per Helius's
  # own docs) and ignores http_poll_interval_seconds. If the WS connection
  # fails, the bot reconnects with backoff and (after enough failures)
  # falls back to HTTP polling.
  use_helius_ws_if_available: true
  http_poll_interval_seconds: 5
  # Discard tokens older than this on first sighting (avoid backfill spam).
  max_token_age_seconds_on_first_sight: 120

# ── Network ───────────────────────────────────────────────────────────────
network:
  http_timeout_seconds: 15.0
  ws_ping_interval_seconds: 20.0
  ws_reconnect_max_backoff_seconds: 60.0
  # Per-host rate limits to be a good citizen.
  rpc_requests_per_second: 8

# ── Telegram notification toggles ─────────────────────────────────────────
telegram:
  notify_on_entry: true
  notify_on_exit: true
  notify_on_kill_switch: true
  notify_on_anomaly: true               # dev drain, score regime change, etc.
  notify_on_high_score: true            # any token scoring >= enter_threshold
  daily_digest: true
  daily_digest_utc_hour: 22

# ── Dashboard ─────────────────────────────────────────────────────────────
dashboard:
  refresh_hz: 4

# ── Event store ───────────────────────────────────────────────────────────
event_store:
  sqlite_path: ./state/events.db
  jsonl_audit_path: ./state/audit.jsonl
